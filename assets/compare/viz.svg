<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="3D-визуализация гостиной">
<defs>
  <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0D0D0D" stop-opacity=".04"/>
    <stop offset=".5" stop-color="#0D0D0D" stop-opacity="0"/>
    <stop offset="1" stop-color="#0D0D0D" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="800" fill="#EAEAEA"/>

  <!-- пол -->
  <path d="M0 800 L1200 800 L870 560 L330 560 Z" fill="#C7C7C7"/>
  <!-- потолок -->
  <path d="M0 0 L1200 0 L870 230 L330 230 Z" fill="#EFEFEF"/>
  <!-- левая стена -->
  <path d="M0 0 L330 230 L330 560 L0 800 Z" fill="#DCDCDC"/>
  <!-- правая стена -->
  <path d="M1200 0 L870 230 L870 560 L1200 800 Z" fill="#E5E5E5"/>
  <!-- задняя стена -->
  <rect x="330" y="230" width="540" height="330" fill="#EAEAEA"/>

  <!-- окно -->
  <rect x="600" y="272" width="230" height="200" fill="#CFCFCF"/>
  <rect x="600" y="272" width="230" height="200" fill="none" stroke="#9A9A9A" stroke-width="5"/>
  <path d="M715 272v200M600 372h230" stroke="#9A9A9A" stroke-width="4"/>
  <path d="M600 472 L560 560 L870 560 L830 472 Z" fill="#FFFFFF" opacity=".5"/>

  <!-- ковёр -->
  <path d="M300 800 L900 800 L800 606 L400 606 Z" fill="#D4D4D4"/>

  <!-- диван у задней стены -->
  <path d="M360 560 L560 560 L560 500 L360 500 Z" fill="#B6B6B6"/>
  <path d="M348 620 L580 620 L570 552 L360 552 Z" fill="#C3C3C3"/>
  <path d="M348 620 L580 620 L578 648 L346 648 Z" fill="#AAAAAA"/>
  <path d="M380 548 L430 548 L432 520 L382 520 Z" fill="#C9BCA8"/>
  <path d="M470 548 L520 548 L522 520 L472 520 Z" fill="#C9BCA8"/>

  <!-- журнальный стол -->
  <path d="M520 700 L720 700 L700 660 L540 660 Z" fill="#AFAFAF"/>
  <path d="M520 700 L720 700 L718 712 L522 712 Z" fill="#949494"/>
  <path d="M548 712v34M694 712v34" stroke="#949494" stroke-width="7"/>

  <!-- подвесной светильник -->
  <path d="M620 0 v96" stroke="#9A9A9A" stroke-width="3"/>
  <path d="M578 96 L662 96 L644 148 L596 148 Z" fill="#A0A0A0"/>
  <ellipse cx="620" cy="150" rx="24" ry="7" fill="#FFFFFF" opacity=".85"/>

  <!-- растение справа -->
  <path d="M900 800 L968 800 L956 700 L912 700 Z" fill="#B6B6B6"/>
  <path d="M934 700 c-70-40-84-140-40-190 30 44 46 96 40 190Z" fill="#9E9E9E"/>
  <path d="M934 700 c66-34 72-124 34-168-26 40-40 84-34 168Z" fill="#8C8C8C"/>

  <!-- картина на левой стене -->
  <path d="M120 250 L250 292 L250 452 L120 430 Z" fill="#D0D0D0"/>

<rect width="1200" height="800" fill="url(#sun)"/>
<rect width="1200" height="800" fill="url(#vg)"/>
<g font-family="SF Pro Display, -apple-system, Segoe UI, sans-serif">
  <rect x="36" y="36" width="232" height="46" rx="23" fill="#0D0D0D"/>
  <text x="60" y="66" font-size="21" font-weight="600" fill="#C9BCA8">3D-визуализация</text>
</g>
</svg>
